# nginx as a REVERSE PROXY + LOAD BALANCER in front of the API containers.

upstream shopapi {
  # "api" is the compose service name. Docker's internal DNS returns the IP of EVERY
  # replica, and nginx spreads requests across them (round-robin by default).
  # max_fails/fail_timeout: after 1 failed attempt, skip that instance for 10s
  # (a "passive" health check, based on real traffic).
  server api:4000 max_fails=1 fail_timeout=10s;
  # nginx runs one worker process per CPU core. Without a shared zone, EACH worker keeps
  # its own round-robin counter, so traffic spreads unevenly. The zone shares the state.
  zone shopapi 64k;
  # Reuse connections to the app instead of opening a new one per request.
  keepalive 32;
}

server {
  listen 80;

  # Reject oversized bodies here, before they ever reach Node.
  client_max_body_size 16k;

  location / {
    proxy_pass http://shopapi;

    # Fail over fast when an instance disappears (e.g. stopped during a deploy).
    # A stopped container's IP stops answering entirely, and the default 60s connect
    # timeout would leave clients hanging. Give up after 2s and try the other instance.
    proxy_connect_timeout 2s;
    # Which failures may be retried on another instance. nginx never retries a request
    # that was already sent for non-idempotent methods like POST (it could be applied twice).
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    # Needed for upstream keepalive.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Tell the app who the real client is (Phase 5: TRUST_PROXY=1 reads these).
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # One id per request, created here and reused by the app's logger,
    # so the nginx log line and the app log line can be matched up.
    proxy_set_header X-Request-Id $request_id;
  }
}
