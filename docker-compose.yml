# The whole system on your laptop with one command: docker compose up -d --build
#
#   http://localhost:8080 -> nginx -> api (2 replicas) -> mongo
#
# Secrets come from your .env file (compose reads it automatically for ${...} values).
# The app uses the LOCAL mongo container here, never your Atlas database.

services:
  mongo:
    image: mongo:8
    # A single-node REPLICA SET: MongoDB only supports transactions on replica sets,
    # and our product/brand code uses transactions (Phase 6).
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017" # so you can seed/inspect it from your laptop
    volumes:
      - mongo-data:/data/db # data survives `docker compose down` (not `down -v`)
    healthcheck:
      # First run: initialise the replica set. Healthy only once this node is PRIMARY
      # (able to accept writes), so the API never starts against a half-ready database.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }; if (!db.hello().isWritablePrimary) quit(1)"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build: .
    image: shopapi:local
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: info
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGODB_DB_NAME: shopapi
      # :? makes compose refuse to start if the secret is missing.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      # Exactly one proxy (nginx) in front of the app.
      TRUST_PROXY: 1
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      mongo:
        condition: service_healthy
    # Two identical instances: horizontal scaling, behind the nginx load balancer.
    # No `ports:` on purpose: the API is only reachable through nginx.
    deploy:
      replicas: 2
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
